<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Tubesheet Layout Generator</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="Tubesheet Layout Generator" content="Tubesheet Layout Generator" />
        <meta name="theme-color" content="#10161E" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#10161E" media="(prefers-color-scheme: dark)" />
        <link
            rel="preload"
            href="/fonts/CommitMono VariableFont.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/InterVariable.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="mask-icon" href="/mask-icon.svg" color="#10161E" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="Tubesheet Layout Generator" />
        <meta property="og:description" content="Shell & tube layout drawings, in the browser" />
        <meta property="og:image" content="/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Tubesheet Layout Generator" />
        <meta name="twitter:description" content="Shell & tube layout drawings, in the browser" />
        <meta name="twitter:image" content="/og-image.png" />

        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("theme-preference");
                    var isDark =
                        stored === "dark" ||
                        (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    var docEl = document.documentElement;
                    docEl.setAttribute("data-theme", isDark ? "dark" : "light");
                    docEl.style.setProperty("color-scheme", isDark ? "dark" : "light");
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
