<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" title="Tubesheet Layout Generator">
  <title>Tubesheet Layout Generator</title>
  <style>
    .bg { fill: #F9F8F6; }
    .glyph { fill: #10161E; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10161E; }
      .glyph { fill: #F9F8F6; }
    }
  </style>
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="512" height="512" fill="#10161E"/>
  </g>
  <!-- shell ring, tube triangle flipped 180deg: single tube now at bottom, pair at top -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <circle cx="256" cy="351.2" r="78" fill="#FFFFFF"/>
  <circle cx="173.6" cy="208.4" r="78" fill="#FFFFFF"/>
  <circle cx="338.4" cy="208.4" r="78" fill="#FFFFFF"/>
</svg>