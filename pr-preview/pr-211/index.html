        <script>
            (function () {
                try {
                    var THEME_COLOR_LIGHT = "#F9F8F6";
                    var THEME_COLOR_DARK = "#10161E";
                    var stored = localStorage.getItem("theme-preference");
                    var isDark =
                        stored === "dark" ||
                        (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
                    var docEl = document.documentElement;
                    docEl.setAttribute("data-theme", isDark ? "dark" : "light");
                    docEl.style.setProperty("color-scheme", isDark ? "dark" : "light");
                    var meta = document.getElementById("theme-color-meta");
                    if (meta)
                        meta.setAttribute("content", isDark ? THEME_COLOR_DARK : THEME_COLOR_LIGHT);
                } catch (e) {}
            })();
        </script>
