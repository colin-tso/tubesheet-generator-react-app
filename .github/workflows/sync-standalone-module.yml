name: "Sync standalone tubesheet-generator module"

# Keeps colin-tso/tubesheet-generator's src/modules.ts + tests/modules.test.ts
# + README.md in sync with this repo's
#   src/plugins/tubesheet-layout-generator.ts(.test.ts) and
#   docs/tubesheet-generator-plugin-readme.md. Any files those import relatively
#   (however deep) are discovered and synced automatically – see
#   scripts/sync-relative-imports.mjs. Also mirrors this repo's package.json
#   license field and any bare-import dependency versions into the target's
#   package.json, and ships the FP tolerance-analysis scripts
#   (scripts/fp-tolerance-analysis) alongside the module so the standalone repo
#   can re-derive/verify the tolerance values against the shipped module.
on:
    push:
        branches:
            - master
        paths:
            - "src/plugins/tubesheet-layout-generator.ts"
            - "src/plugins/tubesheet-layout-generator.test.ts"
            - "src/utils/**"
            - "docs/tubesheet-generator-plugin-readme.md"
            - "scripts/fp-tolerance-analysis/**"
            - "scripts/sync-relative-imports.mjs"
            - "package.json"

permissions:
    contents: read

concurrency:
    group: sync-standalone-module
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout react-app (source)
              uses: actions/checkout@v7
              with:
                  path: source

            - name: Checkout standalone repo (target)
              uses: actions/checkout@v7
              with:
                  repository: colin-tso/tubesheet-generator
                  token: ${{ secrets.GH_ORG_PAT }}
                  path: target

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24.x"

            - name: Copy module, test file, and README; recursively sync relative-import dependencies
              run: |
                  # Discover all relative imports into src/modules.ts and its
                  # test file, and copy into target repo with new local path.
                  # See source/scripts/sync-relative-imports.mjs.
                  mkdir -p target/tests
                  node source/scripts/sync-relative-imports.mjs source target
                  cp source/docs/tubesheet-generator-plugin-readme.md target/README.md

            - name: Sync license from source package.json
              run: |
                  LICENSE=$(jq -r '.license // empty' source/package.json)
                  if [ -z "$LICENSE" ]; then
                      echo "::warning::No license field found in source package.json – skipping."
                  else
                      jq --arg l "$LICENSE" '.license = $l' target/package.json > target/package.json.tmp
                      mv target/package.json.tmp target/package.json
                      echo "Synced license (${LICENSE}) into target package.json"
                  fi

            - name: Sync runtime dependency versions from source package.json
              run: |
                  # Detect the module's actual runtime dependencies by
                  # extracting its bare (non-relative) import specifiers, skip
                  # Node built-ins, and pull each one's version straight from
                  # source's package.json.
                  IMPORTS=$(grep -rhoP "(?<=from [\"'])[^\"'.][^\"']*(?=[\"'])" target/src | tr -d '\r' | sort -u)
                  echo "Detected bare imports: ${IMPORTS:-none}"

                  for pkg in $IMPORTS; do
                      if node -e "process.exit(require('node:module').isBuiltin('$pkg') ? 0 : 1)"; then
                          continue
                      fi

                      version=$(jq -r --arg p "$pkg" '.dependencies[$p] // .devDependencies[$p] // empty' source/package.json)
                      if [ -z "$version" ]; then
                          echo "::warning::${pkg} is imported by modules.ts but not found in source package.json – skipping."
                          continue
                      fi

                      jq --arg p "$pkg" --arg v "$version" '.dependencies[$p] = $v' target/package.json > target/package.json.tmp
                      mv target/package.json.tmp target/package.json
                      echo "Synced ${pkg}@${version} into target dependencies"

                      # Mirror @types/<pkg> too, if the source repo has it –
                      # common for packages that ship without their own types.
                      types_pkg="@types/${pkg}"
                      types_version=$(jq -r --arg p "$types_pkg" '.dependencies[$p] // .devDependencies[$p] // empty' source/package.json)
                      if [ -n "$types_version" ]; then
                          jq --arg p "$types_pkg" --arg v "$types_version" '.devDependencies[$p] = $v' target/package.json > target/package.json.tmp
                          mv target/package.json.tmp target/package.json
                          echo "Synced ${types_pkg}@${types_version} into target devDependencies"
                      fi
                  done

            - name: Sync dev-tool dependency versions from source package.json
              run: |
                  for PKG in vitest tsx; do
                      VERSION=$(jq -r --arg p "$PKG" '.devDependencies[$p] // empty' source/package.json)
                      if [ -z "$VERSION" ]; then
                          echo "::warning::No ${PKG} devDependency found in source package.json – skipping."
                      else
                          jq --arg p "$PKG" --arg v "$VERSION" '.devDependencies[$p] = $v' target/package.json > target/package.json.tmp
                          mv target/package.json.tmp target/package.json
                          echo "Synced ${PKG}@${VERSION} into target devDependencies"
                      fi
                  done

            - name: Align target tsconfig target/lib with source
              run: |
                  # The source module targets ESNext and iterates DOM
                  # NodeListOf (for...of over svg.childNodes), which requires
                  # the DOM.Iterable lib. Rather than patching individual libs
                  # onto the stale ES2020 config, keep the standalone repo's
                  # tsconfig target/lib aligned with the source repo's esnext
                  # setup. Idempotent.
                  jq '.compilerOptions.target = "esnext" |
                      .compilerOptions.lib = ["ESNext", "DOM", "DOM.Iterable"]' \
                      target/tsconfig.json > target/tsconfig.json.tmp
                  mv target/tsconfig.json.tmp target/tsconfig.json
                  echo "Aligned target tsconfig to esnext (target + lib)."

            - name: Install target dependencies
              working-directory: target
              run: npm install

            - name: Run tests (gate – do not push on failure)
              working-directory: target
              run: npx vitest run
              timeout-minutes: 10

            - name: Run FP tolerance-analysis scripts (gate – do not push on failure)
              working-directory: target
              run: |
                  # Ship the scripts AND prove they work against the shipped
                  # module. Script 01 gets a reduced trial count to keep the
                  # gate fast; it still spans all magnitudes and chains.
                  npx tsx scripts/fp-tolerance-analysis/01-measure-guard-noise.mjs 10000
                  npx tsx scripts/fp-tolerance-analysis/02-validate-tolerance-fix.mjs
                  npx tsx scripts/fp-tolerance-analysis/03-validate-against-real-module.mjs

            - name: Compile module for distribution
              working-directory: target
              run: |
                  npx tsc
                  # Patch .js extensions onto every relative import in every
                  # compiled file – whatever tsc emitted, not just modules.js.
                  # See ../source/scripts/fix-esm-extensions.mjs.
                  node ../source/scripts/fix-esm-extensions.mjs src

            - name: Commit and push if changed
              working-directory: target
              env:
                  GH_TOKEN: ${{ secrets.GH_ORG_PAT }}
              run: |
                  git config user.name "${{ secrets.GH_ORG_NAME }}"
                  git config user.email "${{ secrets.GH_ORG_EMAIL }}"
                  git add -A
                  if git diff --cached --quiet; then
                    echo "No changes to sync."
                    exit 0
                  fi
                  SOURCE_SHA=$(cd ../source && git rev-parse --short HEAD)
                  TARGET_BRANCH=$(git branch --show-current)
                  git commit -m "Sync modules.ts from tubesheet-generator-react-app@${SOURCE_SHA}"
                  git push origin "HEAD:${TARGET_BRANCH}"
