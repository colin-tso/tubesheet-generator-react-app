name: Deploy to GitHub Pages

on:
    push:
        branches: [master]

# Avoid two deploys racing each other on the gh-pages branch.
concurrency:
    group: master-deploy
    cancel-in-progress: false

jobs:
    build:
        permissions:
            contents: write
            pages: write
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Caches npm's download cache (~/.npm) keyed on the lockfile. The
            # previous node_modules cache is dropped: `npm ci` deletes
            # node_modules before installing, so restoring it saved nothing.
            - name: Set up toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Deploy
              run: |
                  git config --global user.name $user_name
                  git config --global user.email $user_email
                  git remote set-url origin https://${github_token}@github.com/${repository}
                  npm run deploy
              env:
                  user_name: "github-actions[bot]"
                  user_email: "github-actions[bot]@users.noreply.github.com"
                  github_token: ${{ secrets.GH_ORG_PAT }}
                  repository: ${{ github.repository }}
