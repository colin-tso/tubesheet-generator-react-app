name: "Master - Sync Dev"

# After any PR is merged into master (a release PR from dev, or a direct
# hotfix), merge those changes back into dev so dev never lags behind
# master. Fast-forwards silently when possible (the common case, since dev
# is usually already ahead); otherwise creates a merge commit. If the merge
# does not apply cleanly - e.g. a hotfix touched something dev has since
# changed - fall back to opening a PR so a human can resolve the conflict
# instead of silently failing.
on:
    pull_request:
        branches:
            - master
        types:
            - closed

concurrency:
    group: master-sync-dev
    cancel-in-progress: false

jobs:
    sync-dev:
        name: "Merge master into dev"
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: dev
                  token: ${{ secrets.GH_ORG_PAT }}
                  fetch-depth: 0

            - name: Git config
              run: |
                  git config --global user.email "${{ secrets.GH_ORG_EMAIL }}"
                  git config --global user.name "${{ secrets.GH_ORG_NAME }}"

            - name: Merge master into dev
              id: merge
              run: |
                  git fetch origin master

                  if git merge origin/master -m "chore: merge master into dev [skip ci]"; then
                    # No-op if dev was already up to date (e.g. the PR that
                    # was just merged came from dev itself).
                    git push origin dev
                  else
                    echo "conflict=true" >> "$GITHUB_OUTPUT"
                    git merge --abort
                  fi

            - name: Open PR for manual resolution on conflict
              if: steps.merge.outputs.conflict == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GH_ORG_PAT }}
              run: |
                  branch="sync-master-into-dev-${{ github.event.pull_request.number }}"

                  git checkout -b "$branch"
                  git push origin "$branch"

                  gh pr create \
                    --base dev \
                    --head "$branch" \
                    --title "chore: merge master into dev (conflicts need resolving)" \
                    --body "Automated merge of \`master\` into \`dev\` after #${{ github.event.pull_request.number }} could not be applied cleanly. Please resolve the conflicts on this branch and merge."
