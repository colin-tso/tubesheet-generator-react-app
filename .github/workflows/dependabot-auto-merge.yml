name: Dependabot auto-merge

# This workflow uses `pull_request`, not `pull_request_target`: it checks out
# untrusted PR code, so it must not receive base-repository secrets or a broad
# write token. DEPENDABOT_PAT is a repository-scoped fine-grained token with only
# `Contents: Read and write`; keep it separate from organization tokens used for
# releases or deployments. It must be configured in the Dependabot secret store.
# Repository variables supply the commit identity. GITHUB_TOKEN handles metadata
# and merging, and `contents: write` is limited to the merge operation.
on:
    pull_request:
        branches:
            - dev

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        # Keyed on the PR author rather than github.actor: on `synchronize` the
        # actor is whoever pushed, and a manual re-run uses the re-runner, so an
        # actor check would skip the changeset after a human rebases a Dependabot
        # branch. The head-repo check is defence in depth, so a fork head can
        # never reach DEPENDABOT_PAT.
        if: |
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Add a changeset only for production npm dependency updates.
            # fetch-metadata identifies dependency type and ecosystem; dev-only
            # and GitHub Actions updates are excluded. Keep React and React type
            # dependencies in separate groups because grouped updates report as production.
            - name: Checkout PR branch
              if: |
                  contains(steps.metadata.outputs.dependency-type, 'production') &&
                  !startsWith(steps.metadata.outputs.package-ecosystem, 'github')
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  token: ${{ secrets.DEPENDABOT_PAT }}

            - name: Add changeset for production dependency update
              if: |
                  contains(steps.metadata.outputs.dependency-type, 'production') &&
                  !startsWith(steps.metadata.outputs.package-ecosystem, 'github')
              env:
                  UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  bump="patch"
                  if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
                    bump="major"
                  elif [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
                    bump="minor"
                  fi

                  mkdir -p .changeset
                  cat > ".changeset/dependabot-${PR_NUMBER}.md" <<EOF
                  ---
                  "tubesheet-generator-react-app": ${bump}
                  ---

                  ${PR_TITLE}
                  EOF

                  git config user.email "${{ vars.GH_ORG_EMAIL }}"
                  git config user.name "${{ vars.GH_ORG_NAME }}"
                  git add .changeset

                  # A PAT push re-triggers `synchronize`, so this step runs again
                  # with the changeset already on the branch. Commit only when
                  # something is staged, or that re-run fails on "nothing to
                  # commit" and turns the check red.
                  if git diff --cached --quiet; then
                    echo "Changeset already present; nothing to push."
                    exit 0
                  fi

                  git commit -m "chore: add changeset for dependency update"
                  git push origin "HEAD:$PR_HEAD_REF"

            # `gh pr merge --auto` queues the merge; the dev ruleset's required
            # Validate check must pass before GitHub completes it. Include npm
            # majors, but leave GitHub Actions majors for manual review because
            # the app validation job does not exercise every changed action.
            - name: Enable auto-merge for validated npm majors and patch/minors
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
                  (
                    steps.metadata.outputs.update-type == 'version-update:semver-major' &&
                    steps.metadata.outputs.package-ecosystem == 'npm'
                  )
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
