name: Dependabot auto-merge

# Deliberately `pull_request`, not `pull_request_target`. This workflow checks
# out and pushes to the PR branch, and `pull_request_target` would do that with
# base-repo secrets and a write token (CodeQL: actions/untrusted-checkout/high).
#
# The push authenticates with DEPENDABOT_PAT, a fine-grained token scoped to
# this repository with only `Contents: Read and write`. It is kept separate from
# GH_ORG_PAT on purpose: that token is shared by six other workflows and also
# needs write access to colin-tso/tubesheet-generator, so reusing it here would
# put the release and deploy path behind a PR checkout.
#
# Dependabot-triggered runs cannot see Actions secrets, so DEPENDABOT_PAT must
# also exist in the *Dependabot* secret store (Settings > Secrets and variables
# > Dependabot). There is no fallback and no error if it is missing: checkout
# receives an empty token, falls back to GITHUB_TOKEN, and the push still
# succeeds because of the `contents: write` permission below. The run only
# degrades - it stops using the scoped token, and its commit does not trigger
# other workflows.
#
# The commit identity comes from repository variables instead (GH_ORG_EMAIL and
# GH_ORG_NAME). Variables are not restricted for Dependabot-triggered runs, so
# unlike the token they only have to exist in one place. An unset variable is
# loud rather than silent: the commit fails on `empty ident name`.
#
# The `permissions` block below governs GITHUB_TOKEN only, which still does the
# metadata fetch and `gh pr merge`. Dependabot PRs get a read-only token by
# default; `contents: write` is required because merging writes to the base
# branch.
on:
    pull_request:
        branches:
            - dev

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        # Keyed on the PR author rather than github.actor: on `synchronize` the
        # actor is whoever pushed, and a manual re-run uses the re-runner, so an
        # actor check would skip the changeset after a human rebases a Dependabot
        # branch. The head-repo check is defence in depth, so a fork head can
        # never reach DEPENDABOT_PAT.
        if: |
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v3
              with:
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Only production dependency bumps get a changeset (and therefore
            # a version bump on dev). Dev-only dependency updates are skipped
            # here on purpose. dependabot.yml has to keep production and
            # development in a single update config, so it can no longer label
            # the two cases apart - the distinction comes from fetch-metadata's
            # `dependency-type` output, which reads "direct:production" for a
            # production dependency and "direct:development" for a dev one.
            #
            # For a grouped update fetch-metadata reports the highest-priority
            # type in the group, so a group mixing production and development
            # dependencies reads as "direct:production" and does get a
            # changeset. That is why dependabot.yml keeps `react` (production)
            # and `react-types` (development) in separate groups instead of one
            # group covering both.
            - name: Checkout PR branch
              if: contains(steps.metadata.outputs.dependency-type, 'production')
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.head.ref }}
                  token: ${{ secrets.DEPENDABOT_PAT }}

            - name: Add changeset for production dependency update
              if: contains(steps.metadata.outputs.dependency-type, 'production')
              env:
                  UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  bump="patch"
                  if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
                    bump="major"
                  elif [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
                    bump="minor"
                  fi

                  mkdir -p .changeset
                  cat > ".changeset/dependabot-${PR_NUMBER}.md" <<EOF
                  ---
                  "tubesheet-generator-react-app": ${bump}
                  ---

                  ${PR_TITLE}
                  EOF

                  git config user.email "${{ vars.GH_ORG_EMAIL }}"
                  git config user.name "${{ vars.GH_ORG_NAME }}"
                  git add .changeset

                  # A PAT push re-triggers `synchronize`, so this step runs again
                  # with the changeset already on the branch. Commit only when
                  # something is staged, or that re-run fails on "nothing to
                  # commit" and turns the check red.
                  if git diff --cached --quiet; then
                    echo "Changeset already present; nothing to push."
                    exit 0
                  fi

                  git commit -m "chore: add changeset for dependency update"
                  git push origin "HEAD:$PR_HEAD_REF"

            # For a grouped update `update-type` is the highest semver level in
            # the group, so a group made up of patches still auto-merges and any
            # group containing a major does not.
            - name: Enable auto-merge for patch/minor updates
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor'
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
