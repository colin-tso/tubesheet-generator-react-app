name: "Dev - PR Validation"
on:
    pull_request:
        branches:
            - dev
        types:
            - opened
            - reopened
            - synchronize

permissions:
    contents: read

jobs:
    validate:
        name: "Validate"
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up toolchain
              uses: ./.github/actions/setup-toolchain
              with:
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run tests
              run: npm test -- --run

            - name: Lint TypeScript
              run: npm run lint

            - name: Lint CSS
              run: npm exec -- stylelint "src/**/*.css"

            - name: Build
              run: npm run build

            - name: Prepare artifact-action smoke test
              run: printf '%s\n' "artifact action compatibility test" > "$RUNNER_TEMP/artifact-smoke-test.txt"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: pr-validation-smoke-test
                  path: ${{ runner.temp }}/artifact-smoke-test.txt
                  if-no-files-found: error

            - name: Download artifact
              uses: actions/download-artifact@v8
              with:
                  name: pr-validation-smoke-test
                  path: ${{ runner.temp }}/downloaded-artifact

            - name: Verify downloaded artifact
              run: cmp "$RUNNER_TEMP/artifact-smoke-test.txt" "$RUNNER_TEMP/downloaded-artifact/artifact-smoke-test.txt"
