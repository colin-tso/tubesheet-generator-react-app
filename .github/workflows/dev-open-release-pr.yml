name: "Dev - Open Release PR"

# When the changesets "Version Packages" PR (branch changeset-release/dev)
# is merged into dev, dev is now one version ahead of master and ready to
# ship. Open a PR to merge dev into master, or leave the existing one alone
# if it's already open - GitHub keeps its diff current automatically as
# dev moves.
on:
    pull_request:
        branches:
            - dev
        types:
            - closed

concurrency:
    group: dev-open-release-pr
    cancel-in-progress: false

jobs:
    open-release-pr:
        name: "Open/Update dev -> master PR"
        # Only react to the changesets version-bump PR actually merging, not
        # every PR closed against dev.
        if: |
            github.event.pull_request.merged == true &&
            startsWith(github.event.pull_request.head.ref, 'changeset-release/')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v7

            - name: Create or update "dev -> master" PR
              env:
                  GH_TOKEN: ${{ secrets.GH_ORG_PAT }}
              run: |
                  existing=$(gh pr list --base master --head dev --state open --json number --jq '.[0].number')

                  if [ -n "$existing" ]; then
                    echo "PR #$existing already open for dev -> master; nothing to do."
                    exit 0
                  fi

                  gh pr create \
                    --base master \
                    --head dev \
                    --title "chore: release" \
                    --body "Automated PR to merge \`dev\` into \`master\`, triggered by \`${{ github.event.pull_request.title }}\` (#${{ github.event.pull_request.number }}) merging into \`dev\`."
