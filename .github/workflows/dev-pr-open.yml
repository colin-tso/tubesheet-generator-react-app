name: "Dev - PR Open"
on:
    pull_request:
        branches:
            - dev
        types:
            - opened
permissions:
    pull-requests: write
    contents: read
jobs:
    add_comment:
        name: "Add Comment"
        runs-on: ubuntu-latest
        steps:
            - uses: mshick/add-pr-comment@v3
              with:
                  message: Please set a versioning label of either `major`, `minor`, or `patch` to the pull request.
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
