name: "Dev - PR Changeset Check"
on:
    pull_request:
        branches:
            - dev
        types:
            - opened
            - reopened
            - synchronize
            - labeled
            - unlabeled
permissions:
    contents: read
jobs:
    check_changeset:
        name: "Check For Changeset"
        if: |
            github.actor != 'dependabot[bot]' &&
            !contains(github.event.pull_request.labels.*.name, 'no-changeset')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Verify a changeset was added
              run: |
                  git fetch origin "${{ github.base_ref }}" --depth=1
                  added=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- .changeset | grep -v '.changeset/README.md' || true)
                  if [ -z "$added" ]; then
                    echo "::error::No changeset found. Run 'npx changeset' and commit the generated file, or add the 'no-changeset' label if this PR doesn't need a version bump."
                    exit 1
                  fi
