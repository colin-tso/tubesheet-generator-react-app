version: 2
updates:
    # npm dependencies
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      rebase-strategy: "auto"

    # GitHub Actions workflow dependencies
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
