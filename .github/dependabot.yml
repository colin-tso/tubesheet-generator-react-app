version: 2
updates:
    # npm dependencies
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      labels:
          - "patch"
      open-pull-requests-limit: 10

    # GitHub Actions workflow dependencies
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      labels:
          - "patch"
