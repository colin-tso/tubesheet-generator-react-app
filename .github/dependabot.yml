version: 2
updates:
    # npm dependencies
    # Dependabot requires the package-ecosystem + directory + target-branch
    # combination to be unique, so production and development dependencies must
    # share one entry and be split by `allow` rather than by separate update
    # configs. A single entry also means a single label, so the
    # production/development distinction is no longer carried by a label and
    # dependabot-auto-merge.yml reads it from dependabot/fetch-metadata's
    # `dependency-type` output instead.
    #
    # `groups` is only for packages that have to move in lockstep. A group
    # merges as a single pull request and one member that fails CI blocks all of
    # it, so packages that merely share a name prefix (@vitejs/plugin-react,
    # react-number-format, eslint-plugin-react-*) stay on individual pull
    # requests.
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      rebase-strategy: "auto"
      allow:
          - dependency-type: "production"
          - dependency-type: "development"
      labels:
          - "dependencies"
      # vitest and @vitest/coverage-v8 pin each other as exact peers, so a bump
      # to one that is not also applied to the other leaves a tree npm cannot
      # install. Grouping them keeps the pair in a single pull request.
      groups:
          vitest:
              patterns:
                  - "vitest"
                  - "@vitest/*"

          # react-dom's peer range for react is a caret on its own version, so
          # bumping it alone makes npm pull react forward in the lockfile while
          # package.json still points at the old version. The other half of the
          # release then arrives as a separate pull request that has to rebase,
          # and dev gets a second version bump for what is really one upstream
          # release. Majors stay out of the group so a React major still arrives
          # on its own for review.
          react:
              patterns:
                  - "react"
                  - "react-dom"
              update-types:
                  - "minor"
                  - "patch"

          # @types/react* follow the same releases but are development
          # dependencies, and dependabot-auto-merge.yml keys the changeset off
          # fetch-metadata's `dependency-type`. Keeping the types in their own
          # group keeps that output at "direct:development", so a types-only bump
          # does not mint a version bump on dev.
          react-types:
              patterns:
                  - "@types/react"
                  - "@types/react-dom"

    # GitHub Actions workflow dependencies
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
