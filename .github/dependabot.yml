version: 2
updates:
    # npm production dependencies
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      rebase-strategy: "auto"
      allow:
          - dependency-type: "production"
      labels:
          - "dependencies"
          - "dependencies:production"

    # npm development dependencies
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10
      rebase-strategy: "auto"
      allow:
          - dependency-type: "development"
      labels:
          - "dependencies"
          - "dependencies:development"
      # vitest and @vitest/coverage-v8 pin each other as exact peers, so a bump
      # to one that is not also applied to the other leaves a tree npm cannot
      # install. Grouping them keeps the pair in a single pull request.
      groups:
          vitest:
              patterns:
                  - "vitest"
                  - "@vitest/*"

    # GitHub Actions workflow dependencies
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "dev"
      schedule:
          interval: "weekly"
      labels:
          - "dependencies"
